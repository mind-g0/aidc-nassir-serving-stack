---
services:
  fastapi:
    image: $DOCKER_FASTAPI_IMAGE
    container_name: fastapi
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ai-models:/app
    healthcheck:
      # curl is NOT in python:3.11-slim; python IS. Use python for the probe.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  ai-models:
